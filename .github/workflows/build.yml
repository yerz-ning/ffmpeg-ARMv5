name: Build FFmpeg (ARMv5 Static, V4L2 + H.264 + RTSP)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 安装 ARMv5 交叉编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi make

      - name: 下载 FFmpeg 源码
        run: git clone --depth 1 https://github.com/FFmpeg/FFmpeg.git ffmpeg_src

      - name: 配置编译选项（启用 V4L2 输入 + H.264 编码 + RTSP 输出）
        run: |
          cd ffmpeg_src
          ./configure \
            --arch=arm \
            --target-os=linux \
            --cross-prefix=arm-linux-gnueabi- \
            --enable-static \
            --disable-shared \
            --disable-doc \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-encoders \
            --disable-decoders \
            --enable-decoder=h264 \
            --enable-encoder=rawvideo \
            --enable-encoder=h264 \
            --enable-muxer=rtsp \
            --enable-demuxer=v4l2 \
            --enable-indev=v4l2 \
            --enable-protocol=file,rtsp,tcp \
            --disable-bzlib \
            --disable-zlib \
            --disable-libx264 \
            --extra-cflags="-static -Os -march=armv5te -mtune=arm926ej-s" \
            --extra-ldflags="-static -no-pie"

      - name: 开始编译
        run: |
          cd ffmpeg_src
          make -j2

      - name: 上传编译好的二进制文件
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-armv5-v4l2-rtsp
          path: ffmpeg_src/ffmpeg
